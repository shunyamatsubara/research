<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure 1 pilot</title>
<style>
:root{
  /* colour roles, reused unchanged in Figures 2 and 3 */
  --paper:#fbfaf7;   /* page background */
  --card:#ffffff;    /* panels inside a figure */
  --ink:#1d2330;     /* text, lines of the scene */
  --muted:#6b7280;   /* eyebrow, captions, unchanged values */
  --faint:#b9bdc6;   /* unused / candidate / not yet fixed */
  --line:#d9dbe0;    /* panel borders */
  --ray:#2563eb;     /* the ray and pixel values */
  --hl:#d9480f;      /* the highlighted value being computed (accent) */
  --cam:#0f766e;     /* camera frame (optical axis, camera, P_cam) */
  --base:#7c3aed;    /* base frame (Figures 2-3) */
  --err:#c92a2a;     /* error / trap */
  --table:#d6cfc2;   /* table surface */
  --obj:#e9e3d6;     /* object */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171d; --card:#1c2028; --ink:#e8eaee; --muted:#9aa1ad; --faint:#4a505c;
    --line:#343a46; --ray:#6ea0ff; --hl:#ff9a5c; --cam:#4fd1c0; --base:#b794f6;
    --err:#ff7b7b; --table:#3a362e; --obj:#4a4538;
  }
}
:root[data-theme="dark"]{
  --paper:#14171d; --card:#1c2028; --ink:#e8eaee; --muted:#9aa1ad; --faint:#4a505c;
  --line:#343a46; --ray:#6ea0ff; --hl:#ff9a5c; --cam:#4fd1c0; --base:#b794f6;
  --err:#ff7b7b; --table:#3a362e; --obj:#4a4538;
}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
  line-height:1.6}
figure#fig-1{margin:0 auto;padding:16px;max-width:720px;box-sizing:border-box}
#fig-1 .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
#fig-1 h2{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",Georgia,serif;
  font-size:22px;line-height:1.35;margin:0 0 6px;font-weight:700;color:var(--ink)}
#fig-1 .sub{font-style:italic;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13px;color:var(--muted);margin:0 0 10px}
#fig-1 svg{display:block;width:100%;height:auto}
#fig-1 figcaption{font-size:14px;color:var(--muted);margin-top:8px}
#fig-1 svg text{fill:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans CJK JP",system-ui,sans-serif;font-size:16px}
#fig-1 svg .m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#fig-1 svg .s{font-size:14px}
#fig-1 svg .xs{font-size:13px}
#fig-1 svg .b{font-weight:700}
#fig-1 svg .mu{fill:var(--muted)}
#fig-1 svg .fa{fill:var(--faint)}
#fig-1 svg .ray{fill:var(--ray)}
#fig-1 svg .hl{fill:var(--hl)}
#fig-1 svg .cam{fill:var(--cam)}
#fig-1 svg .er{fill:var(--err)}
</style>
</head>
<body>
<figure id="fig-1">
  <p class="eyebrow">TOY · 640×480 · fx = fy = 600 PX · カメラは机の上 0.8 M</p>
  <h2>1 画素は 1 本の光線で、深度がその上の 1 点を決める</h2>
  <p class="sub">X = (u − cx)·Z / fx,&nbsp; Y = (v − cy)·Z / fy,&nbsp; Z = depth</p>

<svg viewBox="0 0 720 800" role="img" aria-labelledby="f1t f1d" xmlns="http://www.w3.org/2000/svg">
  <title id="f1t">画素から光線、深度で点</title>
  <desc id="f1d">VLM の [y, x] = [750, 625] は画素 (400, 360) になる。カメラ中心からその画素を通る光線の上で、深度 0.75 m が点 P_cam = (0.10, 0.15, 0.75) m を決める。</desc>
  <!-- numbers: toy.md rung 1-2: [750,625], W=640, H=480, (400,360), 80/600, 120/600=0.2, raw 750 x 0.001 = 0.75, P_cam=(0.10,0.15,0.75), wrong order (480,300) 125 mm, table 0.8 m, object top 0.75 m -->

  <!-- STEP 1: VLM output -> pixel -->
  <rect x="8" y="8" width="347" height="144" rx="8" fill="var(--card)" stroke="var(--line)"/>
  <text class="m b" x="22" y="34">VLM [y, x] = [750, 625]</text>
  <text class="m ray" x="22" y="62">u = 0.625·640 = 400</text>
  <text class="m ray" x="22" y="86">v = 0.75 ·480 = 360</text>
  <text class="m b hl" x="22" y="112">→ (u, v) = (400, 360)</text>
  <text class="xs mu" x="22" y="138">x → 幅 640、y → 高さ 480 に掛ける</text>

  <rect x="365" y="8" width="347" height="144" rx="8" fill="var(--card)" stroke="var(--err)" stroke-dasharray="5 4"/>
  <text class="m b er" x="379" y="34">順を取り違える [x, y]</text>
  <text class="m er" x="379" y="62">u = 0.75 ·640 = 480</text>
  <text class="m er" x="379" y="86">v = 0.625·480 = 300</text>
  <text class="m b er" x="379" y="112">→ (480, 300)</text>
  <text class="xs er" x="379" y="138">有効な画素なので落ちず、125 mm 先に行く</text>

  <!-- mini image 640x480 (scale 0.2 px) -->
  <text class="s mu" x="20" y="196">画像 640×480 px</text>
  <rect x="20" y="205" width="128" height="96" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>
  <g stroke="var(--line)" stroke-width="1">
    <line x1="52" y1="205" x2="52" y2="301"/><line x1="84" y1="205" x2="84" y2="301"/><line x1="116" y1="205" x2="116" y2="301"/>
    <line x1="20" y1="229" x2="148" y2="229"/><line x1="20" y1="253" x2="148" y2="253"/><line x1="20" y1="277" x2="148" y2="277"/>
  </g>
  <!-- principal point (320,240) -> (84,253) -->
  <path d="M78 253h12M84 247v12" stroke="var(--cam)" stroke-width="2"/>
  <!-- VLM pixel (400,360) -> (100,277) -->
  <circle cx="100" cy="277" r="5" fill="var(--ray)"/>
  <!-- wrong order (480,300) -> (116,265) -->
  <path d="M111 260l10 10M121 260l-10 10" stroke="var(--err)" stroke-width="2"/>
  <text class="xs cam" x="20" y="322">＋ 主点 (cx, cy) = (320, 240)</text>
  <text class="xs ray" x="20" y="341">● 画素 (u, v) = (400, 360)</text>
  <text class="xs er" x="20" y="360">✕ 取り違え (480, 300)</text>

  <!-- camera -->
  <text class="s b cam" x="280" y="176" text-anchor="middle">カメラ中心（ピンホール）</text>
  <circle cx="280" cy="190" r="7" fill="var(--cam)"/>
  <!-- optical axis -->
  <line x1="280" y1="190" x2="280" y2="578" stroke="var(--cam)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="xs cam" x="280" y="596" text-anchor="middle">光軸 (カメラの z)</text>

  <!-- fx bracket -->
  <line x1="236" y1="192" x2="236" y2="338" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M231 197l5-7 5 7M231 333l5 7 5-7" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <text class="s mu" transform="translate(226 265) rotate(-90)" text-anchor="middle">fx = 600 px</text>

  <!-- image plane -->
  <line x1="220" y1="340" x2="340" y2="340" stroke="var(--ink)" stroke-width="3.5"/>
  <text class="xs mu" x="220" y="330" text-anchor="middle">v=0</text>
  <text class="xs mu" x="340" y="330" text-anchor="middle">v=480</text>
  <text class="s mu" x="372" y="344">画像平面（v 方向の断面）</text>
  <circle cx="280" cy="340" r="4" fill="var(--cam)"/>
  <!-- pixel offset 120 px -->
  <line x1="280" y1="340" x2="310" y2="340" stroke="var(--ray)" stroke-width="3.5"/>
  <text class="xs ray" x="298" y="360" text-anchor="middle">+120 px</text>

  <!-- ray -->
  <line x1="280" y1="190" x2="346" y2="520" stroke="var(--ray)" stroke-width="2.5"/>
  <line x1="346" y1="520" x2="358" y2="580" stroke="var(--ray)" stroke-width="2.5" stroke-dasharray="4 5" opacity=".5"/>
  <circle cx="310" cy="340" r="5.5" fill="var(--ray)"/>

  <!-- slope labels -->
  <text class="s b ray" x="330" y="222">光線の傾き（Z によらず一定）</text>
  <text class="m ray" x="330" y="248" style="font-size:15px">(u−cx)/fx = 80/600 ≈ 0.133</text>
  <text class="m ray" x="330" y="270" style="font-size:15px">(v−cy)/fy = 120/600 = 0.2</text>

  <!-- callout: ray alone does not fix the point -->
  <text class="s b mu" x="372" y="378">光線の上のどの点も同じ画素に写る。</text>
  <text class="s b mu" x="372" y="398">光線だけでは 1 点に決まらない</text>

  <!-- candidates (Z = 0.50, 0.60, 0.68 m ; y = 190 + 440 Z ; x = 280 + 0.2 (y-190)) -->
  <g fill="var(--ray)" opacity=".35">
    <circle cx="324" cy="410" r="5"/><circle cx="333" cy="454" r="5"/><circle cx="340" cy="489" r="5"/>
  </g>
  <text class="s fa" x="372" y="430">Z = 0.50 m ?</text>
  <text class="s fa" x="372" y="466">Z = 0.60 m ?</text>
  <text class="s fa" x="372" y="494">Z = 0.68 m ?</text>

  <!-- Z bracket (0.75 m) -->
  <line x1="256" y1="192" x2="256" y2="518" stroke="var(--hl)" stroke-width="2"/>
  <path d="M251 197l5-7 5 7M251 513l5 7 5-7" fill="none" stroke="var(--hl)" stroke-width="2"/>
  <text class="s b hl" transform="translate(246 380) rotate(-90)" text-anchor="middle">深度 Z = 0.75 m</text>

  <!-- table and object -->
  <rect x="20" y="542" width="680" height="12" fill="var(--table)"/>
  <text class="s mu" x="20" y="536">机の面 Z = 0.80 m</text>
  <rect x="327" y="520" width="38" height="22" fill="var(--obj)" stroke="var(--ink)" stroke-width="1.5"/>
  <line x1="327" y1="520" x2="365" y2="520" stroke="var(--hl)" stroke-width="3.5"/>
  <text class="s mu" x="380" y="576">物体（高さ 5 cm）の上面 Z = 0.75 m</text>

  <!-- highlighted point and lateral offset -->
  <line x1="280" y1="520" x2="346" y2="520" stroke="var(--hl)" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="xs b hl" x="296" y="512" text-anchor="middle">Y</text>
  <circle cx="346" cy="520" r="8.5" fill="var(--hl)" stroke="var(--paper)" stroke-width="2"/>
  <text class="s b hl" x="380" y="514">深度で決まる点 P_cam</text>

  <!-- arithmetic box -->
  <rect x="8" y="612" width="704" height="132" rx="8" fill="var(--card)" stroke="var(--hl)" stroke-width="2"/>
  <text class="m hl" x="24" y="640" style="font-size:17px">Z = 750 × 0.001 m = 0.75 m</text>
  <text class="m b hl" x="24" y="668" style="font-size:17px">X = 80/600 × 0.75 = 0.10 m</text>
  <text class="m hl" x="24" y="696" style="font-size:17px">Y = 0.2 × 0.75 = 0.15 m</text>
  <text class="m b cam" x="24" y="728" style="font-size:18px">P_cam = (0.10, 0.15, 0.75) m</text>
  <text class="xs mu" x="388" y="728">カメラ座標 (x 右, y 下, z 前)</text>

  <text class="xs mu" x="12" y="768">側面図は v 方向（下向き y）。x 方向も同じ割り算で、X = 0.10 m は紙面に垂直。</text>
  <text class="xs mu" x="12" y="788">画像平面は模式で縮尺は Z と別。レンズの歪みは無視。</text>
</svg>

  <figcaption>VLM の [y, x] を 640×480 に掛けると画素 (400, 360) になり、その画素はカメラ中心を通る 1 本の光線を指す（傾き 0.133 と 0.2）。光線の上には無数の点があり、深度 0.75 m を読んで初めて P_cam = (0.10, 0.15, 0.75) m に決まる。</figcaption>
</figure>
</body>
</html>
