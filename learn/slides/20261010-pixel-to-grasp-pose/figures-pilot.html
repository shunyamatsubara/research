<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figures pilot</title>
<style>
:root{
  /* colour roles, reused unchanged in Figures 2 and 3 */
  --paper:#fbfaf7;   /* page background */
  --card:#ffffff;    /* panels inside a figure */
  --ink:#1d2330;     /* text, lines of the scene */
  --muted:#6b7280;   /* eyebrow, captions, unchanged values */
  --faint:#b9bdc6;   /* unused / candidate / not yet fixed */
  --line:#d9dbe0;    /* panel borders */
  --ray:#2563eb;     /* the ray and pixel values */
  --hl:#d9480f;      /* the highlighted value being computed (accent) */
  --cam:#0f766e;     /* camera frame (optical axis, camera, P_cam) */
  --base:#7c3aed;    /* base frame (Figures 2-3) */
  --err:#c92a2a;     /* error / trap */
  --table:#d6cfc2;   /* table surface */
  --obj:#e9e3d6;     /* object */
  --amber:#b7791f;   /* camera z axis (Figures 2-3) */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171d; --card:#1c2028; --ink:#e8eaee; --muted:#9aa1ad; --faint:#4a505c;
    --line:#343a46; --ray:#6ea0ff; --hl:#ff9a5c; --cam:#4fd1c0; --base:#b794f6;
    --err:#ff7b7b; --table:#3a362e; --obj:#4a4538; --amber:#f0b44c;
  }
}
:root[data-theme="dark"]{
  --paper:#14171d; --card:#1c2028; --ink:#e8eaee; --muted:#9aa1ad; --faint:#4a505c;
  --line:#343a46; --ray:#6ea0ff; --hl:#ff9a5c; --cam:#4fd1c0; --base:#b794f6;
  --err:#ff7b7b; --table:#3a362e; --obj:#4a4538; --amber:#f0b44c;
}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
  line-height:1.6}
figure.fig{margin:0 auto 24px;padding:16px;max-width:720px;box-sizing:border-box}
.fig .eyebrow{font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--muted);margin:0 0 4px}
.fig h2{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",Georgia,serif;
  font-size:22px;line-height:1.35;margin:0 0 6px;font-weight:700;color:var(--ink)}
.fig .sub{font-style:italic;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13px;color:var(--muted);margin:0 0 10px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.fig svg text{fill:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans CJK JP",system-ui,sans-serif;font-size:15px}
.fig svg .m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.fig svg .s{font-size:14px}
.fig svg .l{font-size:18px}
.fig svg .xl{font-size:20px}
.fig svg .b{font-weight:700}
.fig svg .mu{fill:var(--muted)}
.fig svg .ray{fill:var(--ray)}
.fig svg .hl{fill:var(--hl)}
.fig svg .cam{fill:var(--cam)}
.fig svg .base{fill:var(--base)}
.fig svg .amb{fill:var(--amber)}
.fig svg .er{fill:var(--err)}
.fig svg .mid{text-anchor:middle}
.fig svg .end{text-anchor:end}
</style>
</head>

  <h2>画像は画素のマス目で、VLM の答えは画像の大きさに対する割合だ</h2>

  <h2>1 画素は 1 本の光線になり、深度がその上の 1 点を決める</h2>
  <p class="sub">X = (u − cx)·Z / fx,&nbsp; Y = (v − cy)·Z / fy</p>
